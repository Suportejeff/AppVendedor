        <a class="nav-btn" style="display:inline-block;margin-top:16px;--book-accent: var(--book-${book.cor})" href="#/book/${book.id}">Ver meu progresso</a>
      </div>`;
  }

  const done = isChapterDone(cap.id);
  const prev = chapters[idx - 1];
  const next = chapters[idx + 1];
  const isFav = !!progress.favorites[cap.id];
  const hasQuiz = cap.quiz && cap.quiz.length > 0;

  const tabsHTML = `
    <div class="reader-tabs">
      <button class="rtab ${activeTab === "ler" ? "active" : ""}" data-tab="ler">Ler</button>
      ${hasQuiz ? `<button class="rtab ${activeTab === "quiz" ? "active" : ""}" data-tab="quiz">Quiz</button>` : ""}
      <button class="rtab ${activeTab === "notas" ? "active" : ""}" data-tab="notas">Notas</button>
    </div>`;

  let bodyHTML = "";
  if (activeTab === "quiz" && hasQuiz) {
    bodyHTML = renderQuizTab(cap);
  } else if (activeTab === "notas") {
    bodyHTML = renderNotesTab(cap);
  } else {
    const checklistHTML = (cap.checklist || []).map((item, i) => {
      const checked = !!(progress.checklist[cap.id] && progress.checklist[cap.id][i]);
      return `<div class="checklist-item ${checked ? "checked-text" : ""}" data-check-idx="${i}">
        <div class="checkbox ${checked ? "checked" : ""}">${checked ? ICONS.check : ""}</div><div>${item}</div></div>`;
    }).join("");

    bodyHTML = `
      <p class="reader-hook">${cap.hook}</p>
      <div class="sec"><div class="sec-label">🎯 Introdução</div><div class="sec-body">${cap.introducao}</div></div>
      <div class="sec"><div class="sec-label">📌 Desenvolvimento</div><div class="sec-body">${cap.desenvolvimento}</div></div>
      <div class="sec"><div class="sec-label">💬 Exemplo real</div><div class="sec-body box">${cap.exemplos}</div></div>
      <div class="sec"><div class="sec-label">⚙️ Aplicação prática</div><div class="sec-body">${cap.aplicacao}</div></div>
      <div class="sec"><div class="sec-label">🧠 Resumo do dia</div><div class="box"><ul class="resumo-list">${cap.resumo.map(r => `<li>${r}</li>`).join("")}</ul></div></div>
      <div class="sec"><div class="sec-label">✅ Checklist</div><div class="box" id="checklist-box">${checklistHTML}</div></div>
      <div class="sec"><div class="sec-label">✍️ Exercício</div><div class="sec-body box">${cap.exercicio}</div></div>
      <div class="sec"><div class="sec-label">🔥 Missão prática</div><div class="sec-body box accent">${cap.missao}</div></div>
      <div class="sec"><div class="sec-label">🏁 Conclusão</div><div class="sec-body conclusao-box">${cap.conclusao}</div></div>
      <div class="proximo-box">➡️&nbsp; <span><strong>Próximo passo:</strong> ${cap.proximoPasso}</span></div>
      <button class="complete-btn ${done ? "done" : ""}" id="complete-btn">${done ? "✓ Dia concluído" : "Marcar dia como concluído (+20 XP)"}</button>
      <div class="nav-row">
        <a class="nav-btn" href="${prev ? `#/chapter/${book.id}/${prev.id}` : "#"}" ${!prev ? "disabled" : ""}>← Dia anterior</a>
        <a class="nav-btn" href="${next && !next.locked && !isGateLocked(next.id) ? `#/chapter/${book.id}/${next.id}` : `#/book/${book.id}`}">${next && !next.locked && !isGateLocked(next.id) ? "Próximo dia →" : "Ver módulo →"}</a>
      </div>`;
  }

  return `
    <div class="topbar" style="${accentVar}">
      <a class="back-btn" href="#/book/${book.id}">${ICONS.back} Voltar</a>
      <button class="fav-btn ${isFav ? "active" : ""}" id="fav-btn">${isFav ? ICONS.starFilled : ICONS.star}</button>
    </div>
    <div class="reader view-enter" style="${accentVar}">
      <div class="reader-eyebrow">${book.titulo} · ${book.id === "l1" ? "Dia" : "Capítulo"} ${cap.num} · ⏱ ${cap.tempoEstimado || 5} min</div>
      <h1 class="reader-title">${cap.title}</h1>
      ${tabsHTML}
      ${bodyHTML}
    </div>`;
}

function renderQuizTab(cap) {
  const total = cap.quiz.length;
  const existing = progress.quizResults[cap.id];

  if (!quizSession || quizSession.chapterId !== cap.id) {
    quizSession = { chapterId: cap.id, idx: 0, correct: 0, selected: null, revealed: false, finished: false };
  }

  if (quizSession.finished) {
    const perfect = quizSession.correct === total;
    return `
      <div class="quiz-result view-enter">
        <div class="quiz-result-icon">${perfect ? "🏆" : "🎯"}</div>
        <div class="quiz-result-title">${quizSession.correct}/${total} acertos</div>
        <div class="quiz-result-sub">${perfect ? "Perfeito! Bônus de XP aplicado." : "Bom trabalho — revise o capítulo se quiser melhorar."}</div>
        <button class="complete-btn" id="quiz-retry">Refazer quiz</button>
      </div>`;
  }

  const q = cap.quiz[quizSession.idx];
  const optionsHTML = q.options.map((opt, i) => {
    let cls = "quiz-option";
    if (quizSession.revealed) {
      if (i === q.correct) cls += " correct";
      else if (i === quizSession.selected) cls += " wrong";
    } else if (quizSession.selected === i) {
      cls += " selected";
    }
    return `<button class="${cls}" data-opt-idx="${i}" ${quizSession.revealed ? "disabled" : ""}>${opt}</button>`;
  }).join("");

  return `
    <div class="quiz-box view-enter">
      <div class="quiz-progress">Quiz · ${quizSession.idx + 1}/${total}</div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">${optionsHTML}</div>
      ${quizSession.revealed ? `<div class="quiz-explain ${quizSession.selected === q.correct ? "ok" : "bad"}">${q.explain}</div>` : ""}
      ${quizSession.revealed
        ? `<button class="complete-btn" id="quiz-next">${quizSession.idx + 1 === total ? "Ver resultado" : "Próxima pergunta"}</button>`
        : `<button class="complete-btn" id="quiz-confirm" ${quizSession.selected === null ? "disabled style='opacity:.4'" : ""}>Confirmar</button>`}
      ${existing ? `<div class="quiz-prev-result">Última tentativa: ${existing.correct}/${existing.total} acertos</div>` : ""}
    </div>`;
}

function renderNotesTab(cap) {
  const note = progress.notes[cap.id] || "";
  return `
    <div class="notes-box view-enter">
      <div class="notes-label">Sua anotação sobre este dia</div>
      <textarea class="notes-textarea" id="notes-textarea" placeholder="Escreva aqui o que mais te marcou, uma ideia pra aplicar hoje, ou uma dúvida...">${note}</textarea>
      <div class="notes-saved-hint" id="notes-saved-hint">Salvo automaticamente</div>
    </div>`;
}

// ---------- Desempenho ----------
function renderDesempenho() {
  const stats = studyStats();
  const minutes = totalMinutesStudied();
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  const last14 = Array.from({ length: 14 }).map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (13 - i));
    return { date: d, active: !!progress.activityLog[todayKey(d)] };
  });

  const barsHTML = last14.map(d => `<div class="bar ${d.active ? "active" : ""}" title="${d.date.toLocaleDateString("pt-BR")}"></div>`).join("");

  const perBookHTML = BOOKS.map(book => `
    <div class="perf-book-row">
      <span>${book.titulo}</span>
      <div class="book-progress-track" style="flex:1;margin:0 10px"><div class="book-progress-fill" style="width:${bookProgressPct(book)}%;background:var(--book-${book.cor})"></div></div>
      <span class="perf-pct">${bookProgressPct(book)}%</span>
    </div>`).join("");

  return `
    ${topbarHTML(false)}
    <div class="hero view-enter" style="padding-bottom:6px"><h1 class="hero-title" style="font-size:24px">Seu desempenho</h1></div>

    <div class="metric-grid view-enter">
      <div class="metric-card"><div class="metric-num">${hours}h${mins > 0 ? mins+"min" : ""}</div><div class="metric-label">estudadas</div></div>
      <div class="metric-card"><div class="metric-num">${stats.chaptersDone}</div><div class="metric-label">capítulos concluídos</div></div>
      <div class="metric-card"><div class="metric-num">${stats.streak}</div><div class="metric-label">sequência atual</div></div>
      <div class="metric-card"><div class="metric-num">${progress.xp}</div><div class="metric-label">XP total</div></div>
    </div>

    <div class="section-label">Atividade — últimos 14 dias</div>
    <div class="bar-chart view-enter">${barsHTML}</div>

    <div class="section-label">Progresso por livro</div>
    <div class="box view-enter" style="margin:0 20px">${perBookHTML}</div>

    <div class="footer-credit" style="padding-bottom:90px"></div>
    ${bottomNavHTML("desempenho")}
  `;
}

// ---------- Conquistas ----------
function renderConquistas() {
  checkAchievements();
  const unlockedCount = ACHIEVEMENTS_DEF.filter(a => progress.achievementsUnlocked[a.id]).length;
  const cards = ACHIEVEMENTS_DEF.map((a, i) => {
    const unlocked = !!progress.achievementsUnlocked[a.id];
    return `
      <div class="ach-card ${unlocked ? "unlocked c" + (i % 5) : ""}">
        <div class="ach-card-icon">${a.icon}</div>
        <div class="ach-card-name">${a.name}</div>
        <div class="ach-card-desc">${a.desc}</div>
      </div>`;
  }).join("");

  return `
    ${topbarHTML(false)}
    <div class="hero view-enter" style="padding-bottom:6px">
      <h1 class="hero-title" style="font-size:24px">Conquistas</h1>
      <p class="hero-sub">${unlockedCount}/${ACHIEVEMENTS_DEF.length} desbloqueadas</p>
    </div>
    <div class="ach-grid view-enter">${cards}</div>
    <div class="footer-credit" style="padding-bottom:90px"></div>
    ${bottomNavHTML("conquistas")}
  `;
}

// ---------- Perfil ----------
function renderPerfil() {
  const stats = studyStats();
  const { current } = getLevelInfo(progress.xp);
  const initials = (progress.userName || "JR").split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();

  return `
    ${topbarHTML(false)}
    <div class="profile-header view-enter">
      <div class="profile-avatar">${initials}</div>
      <input class="profile-name-input" id="profile-name-input" value="${progress.userName || ""}" placeholder="Seu nome" />
      <div class="profile-level">Nível ${current.level} · ${current.name}</div>
      <div class="profile-stats-row">
        <div><strong>${progress.xp}</strong><span>XP</span></div>
        <div><strong>${stats.streak}</strong><span>dias seguidos</span></div>
        <div><strong>${stats.chaptersDone}</strong><span>capítulos</span></div>
      </div>
    </div>

    <div class="profile-menu view-enter">
      <a class="profile-menu-item" href="#/conquistas"><span>🏆 Conquistas (${Object.keys(progress.achievementsUnlocked).length}/${ACHIEVEMENTS_DEF.length})</span>${ICONS.chevRight}</a>
      <a class="profile-menu-item" href="#/desempenho"><span>📊 Histórico e desempenho</span>${ICONS.chevRight}</a>
      <div class="profile-menu-item" id="open-notes-list"><span>📝 Notas e favoritos</span>${ICONS.chevRight}</div>
    </div>

    <div id="notes-list-panel"></div>

    <div class="footer-credit" style="padding-bottom:90px">Método Vendas de Elite © Jeferson Reis</div>
    ${bottomNavHTML("perfil")}
  `;
}

function notesListHTML() {
  const entries = allChaptersFlat().filter(c => !c.locked && (progress.notes[c.id] || progress.favorites[c.id]));
  if (!entries.length) return `<div class="box" style="margin:12px 20px" >Nenhuma nota ou favorito ainda. Marque um capítulo com ⭐ ou escreva uma nota na aba "Notas" da leitura.</div>`;
  return `<div class="box" style="margin:12px 20px">${entries.map(c => `
    <a href="#/chapter/${c.bookId}/${c.id}" class="note-list-item">
      <div>${progress.favorites[c.id] ? "⭐ " : ""}<strong>${c.title}</strong></div>
      ${progress.notes[c.id] ? `<div class="note-list-preview">${progress.notes[c.id].slice(0,80)}</div>` : ""}
    </a>`).join("")}</div>`;
}

// =====================================================
// MAIN RENDER
// =====================================================
function render(resetScroll) {
  const route = parseHash();
  const app = document.getElementById("app");
  let html = "";
  if (route.view === "home") html = renderHome();
  else if (route.view === "biblioteca") html = renderBiblioteca();
  else if (route.view === "book") html = renderBook(route.bookId);
  else if (route.view === "chapter") html = renderChapter(route.bookId, route.chapterId);
  else if (route.view === "desempenho") html = renderDesempenho();
  else if (route.view === "conquistas") html = renderConquistas();
  else if (route.view === "perfil") html = renderPerfil();
  else html = renderHome();

  app.innerHTML = html;
  if (resetScroll) window.scrollTo(0, 0);
  attachHandlers(route);
}
// Atualização local (checklist, quiz, favorito etc.) — nunca move o scroll
function refresh() { render(false); }

function attachHandlers(route) {
  const bellBtn = document.getElementById("bell-btn");
  if (bellBtn) bellBtn.addEventListener("click", (e) => { e.stopPropagation(); notifPanelOpen = !notifPanelOpen; refresh(); });
  const markAllBtn = document.getElementById("mark-all-read");
  if (markAllBtn) markAllBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); markAllRead(); refresh(); });
  const reminderBtn = document.getElementById("toggle-reminder");
  if (reminderBtn) reminderBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleReminder(); refresh(); });
  document.querySelectorAll(".notif-item").forEach(el => el.addEventListener("click", () => { markNotifRead(el.dataset.notifId); notifPanelOpen = false; }));
  const panel = document.querySelector(".notif-panel");
  if (panel) panel.addEventListener("click", (e) => e.stopPropagation());
  if (notifPanelOpen) document.addEventListener("click", closePanelOnce);

  const gateBannerClose = document.getElementById("gate-banner-close");
  if (gateBannerClose) gateBannerClose.addEventListener("click", () => { dismissGateBanner(); refresh(); });

  // Reader tabs
  document.querySelectorAll(".rtab").forEach(el => el.addEventListener("click", () => { activeTab = el.dataset.tab; refresh(); }));

  if (route.view === "chapter") {
    const btn = document.getElementById("complete-btn");
    if (btn) btn.addEventListener("click", () => {
      const wasDone = isChapterDone(route.chapterId);
      progress.done[route.chapterId] = true;
      if (!wasDone) {
        addXp(XP_RULES.chapterComplete + XP_RULES.missionComplete);
        logActivity();
        pushToast(`+${XP_RULES.chapterComplete + XP_RULES.missionComplete} XP — dia concluído!`, "⚡");
        celebrateNewAchievements(checkAchievements());
      }
      saveProgress(progress);
      refresh();
    });
    const box = document.getElementById("checklist-box");
    if (box) box.querySelectorAll(".checklist-item").forEach(el => el.addEventListener("click", () => {
      const idx = Number(el.dataset.checkIdx);
      if (!progress.checklist[route.chapterId]) progress.checklist[route.chapterId] = {};
      progress.checklist[route.chapterId][idx] = !progress.checklist[route.chapterId][idx];
      saveProgress(progress);
      refresh();
    }));
    const favBtn = document.getElementById("fav-btn");
    if (favBtn) favBtn.addEventListener("click", () => {
      progress.favorites[route.chapterId] = !progress.favorites[route.chapterId];
      saveProgress(progress);
      celebrateNewAchievements(checkAchievements());
      refresh();
    });

    // Quiz handlers
    document.querySelectorAll(".quiz-option").forEach(el => el.addEventListener("click", () => {
      quizSession.selected = Number(el.dataset.optIdx);
      refresh();
    }));
    const quizConfirm = document.getElementById("quiz-confirm");
    if (quizConfirm) quizConfirm.addEventListener("click", () => {
      if (quizSession.selected === null) return;
      quizSession.revealed = true;
      const book = findBook(route.bookId);
      const cap = allChapters(book).find(c => c.id === route.chapterId);
      if (quizSession.selected === cap.quiz[quizSession.idx].correct) quizSession.correct++;
      refresh();
    });
    const quizNext = document.getElementById("quiz-next");
    if (quizNext) quizNext.addEventListener("click", () => {
      const book = findBook(route.bookId);
      const cap = allChapters(book).find(c => c.id === route.chapterId);
      if (quizSession.idx + 1 < cap.quiz.length) {
        quizSession.idx++; quizSession.selected = null; quizSession.revealed = false;
      } else {
        quizSession.finished = true;
        const total = cap.quiz.length;
        const perfect = quizSession.correct === total;
        const already = progress.quizResults[cap.id];
        if (!already) {
          let xp = quizSession.correct * XP_RULES.quizCorrectPerQuestion;
          if (perfect) xp += XP_RULES.quizPerfectBonus;
          addXp(xp);
          pushToast(`+${xp} XP no quiz!`, "🧠");
          logActivity();
        }
        progress.quizResults[cap.id] = { correct: quizSession.correct, total, perfect };
        saveProgress(progress);
        celebrateNewAchievements(checkAchievements());
      }
      refresh();
    });
    const quizRetry = document.getElementById("quiz-retry");
    if (quizRetry) quizRetry.addEventListener("click", () => {
      quizSession = null; refresh();
    });

    // Notes autosave
    const notesArea = document.getElementById("notes-textarea");
    if (notesArea) {
      let debounce;
      notesArea.addEventListener("input", () => {
        clearTimeout(debounce);
        const hint = document.getElementById("notes-saved-hint");
        if (hint) hint.textContent = "Salvando...";
        debounce = setTimeout(() => {
          progress.notes[route.chapterId] = notesArea.value;
          saveProgress(progress);
          celebrateNewAchievements(checkAchievements());
          if (hint) hint.textContent = "Salvo automaticamente";
        }, 500);
      });
    }
  }

  if (route.view === "perfil") {
    const nameInput = document.getElementById("profile-name-input");
    if (nameInput) {
      let debounce;
      nameInput.addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { progress.userName = nameInput.value; saveProgress(progress); }, 400);
      });
    }
    const openNotes = document.getElementById("open-notes-list");
    if (openNotes) openNotes.addEventListener("click", () => {
      const p = document.getElementById("notes-list-panel");
      p.innerHTML = p.innerHTML ? "" : notesListHTML();
    });
  }
}

function closePanelOnce() {
  notifPanelOpen = false;
  document.removeEventListener("click", closePanelOnce);
  refresh();
}

</script>
</body>
</html>
