<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Método Vendas de Elite — Jeferson Reis</title>
<meta name="description" content="Coleção Método Vendas de Elite, por Jeferson Reis. Disciplina, comunicação e fechamento para quem vive de vender." />
<meta name="theme-color" content="#0B0F16" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================
   MÉTODO VENDAS DE ELITE — Design tokens
   ===================================================== */
:root {
  --bg: #0B0F16;
  --surface: #131826;
  --surface-2: #1B2233;
  --border: #232B3D;
  --text: #F2F0EA;
  --text-dim: #9AA3B2;
  --text-faint: #5C6579;
  --gold: #C9A15A;
  --gold-bright: #E8C87E;
  --gold-deep: #8A6A2E;
  --rose: #C77B6B;
  --emerald: #4E9E82;
  --success: #4CAF7D;
  --danger: #C4634F;

  --book-gold: #C9A15A;
  --book-blue: #5B8DBE;
  --book-teal: #4FA7A0;
  --book-purple: #9B7FC7;
  --book-crimson: #C4634F;

  --font-display: "Fraunces", serif;
  --font-body: "Manrope", sans-serif;
  --font-mono: "Space Mono", monospace;

  --radius: 14px;
  --radius-sm: 8px;
  --max-w: 480px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(201,154,70,0.08), transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(91,141,190,0.06), transparent 50%);
  background-attachment: fixed;
}

#app {
  max-width: var(--max-w);
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 48px;
  position: relative;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

::selection { background: var(--gold); color: #0B0F16; }

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 14px;
  position: sticky;
  top: 0;
  background: linear-gradient(var(--bg) 70%, transparent);
  backdrop-filter: blur(6px);
  z-index: 20;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}

.brand-name {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text);
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 14px 8px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  transition: border-color .15s ease, color .15s ease;
}
.back-btn:hover { color: var(--text); border-color: var(--gold); }

/* ---------- Home ---------- */
.hero {
  padding: 8px 20px 22px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: 29px;
  font-weight: 600;
  font-style: normal;
  line-height: 1.12;
  letter-spacing: -0.01em;
  margin: 6px 0 8px;
}

.hero-title span { color: var(--gold); font-style: italic; font-weight: 500; }

.hero-sub {
  color: var(--text-dim);
  font-size: 14.5px;
  line-height: 1.5;
  max-width: 40ch;
}

.streak-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 22px 20px 6px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.streak-ring {
  flex-shrink: 0;
}

.streak-info { display: flex; flex-direction: column; gap: 2px; }
.streak-num { font-family: var(--font-display); font-size: 22px; }
.streak-label { color: var(--text-dim); font-size: 12.5px; }

/* ---------- Bell / notifications ---------- */
.bell-btn {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .15s ease, border-color .15s ease;
}
.bell-btn:hover { color: var(--gold); border-color: var(--gold); }

.bell-dot {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg);
}

.notif-panel {
  margin: 0 20px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.notif-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.02em;
}

.notif-mark-all {
  background: none;
  border: none;
  color: var(--gold);
  font-size: 11px;
  font-family: var(--font-body);
}

.notif-list { max-height: 320px; overflow-y: auto; }

.notif-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.notif-item:last-child { border-bottom: none; }
.notif-item:hover { background: var(--surface-2); }
.notif-item.unread .notif-title { color: var(--text); }
.notif-item:not(.unread) { opacity: 0.55; }

.notif-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.notif-text { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-top: 5px; flex-shrink: 0; }

.reminder-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface-2);
}
.reminder-text { display: flex; flex-direction: column; gap: 3px; }
.reminder-text strong { font-size: 12.5px; }
.reminder-text span { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

.toggle {
  width: 42px;
  height: 24px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
  padding: 2px;
  flex-shrink: 0;
  transition: background .15s ease, border-color .15s ease;
}
.toggle .toggle-knob {
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: transform .18s ease, background .18s ease;
}
.toggle.on { background: var(--gold); border-color: var(--gold); }
.toggle.on .toggle-knob { transform: translateX(18px); background: #0B0F16; }

/* ---------- Cover carousel ---------- */
.carousel {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 6px 20px 16px;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.carousel::-webkit-scrollbar { height: 0; }

.cover-card {
  flex: 0 0 148px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
}

.cover-art {
  width: 148px;
  height: 217px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  transition: transform .15s ease, border-color .15s ease;
}
.cover-art svg { display: block; width: 100%; height: 100%; }
.cover-card:hover .cover-art { transform: translateY(-3px); border-color: var(--book-accent, var(--gold)); }

.cover-progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.cover-progress-fill { height: 100%; background: var(--book-accent, var(--gold)); }

.cover-card-title {
  font-family: var(--font-display);
  font-size: 12.5px;
  line-height: 1.3;
  margin-top: 7px;
  color: var(--text);
}
.cover-card-pct { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

/* ---------- Book list ---------- */
.book-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 20px 8px;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 0 20px;
  margin-top: 8px;
}

.book-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: transform .15s ease, border-color .15s ease;
}
.book-card:active { transform: scale(0.98); }
.book-card:hover { border-color: var(--book-accent, var(--gold)); }

.book-num {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--book-accent, var(--gold));
  width: 34px;
  flex-shrink: 0;
  text-align: center;
}

.book-card-body { flex: 1; min-width: 0; }

.book-card-title {
  font-family: var(--font-display);
  font-size: 15.5px;
  letter-spacing: 0.01em;
  margin-bottom: 3px;
}

.book-card-sub {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.4;
}

.book-progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.book-progress-fill {
  height: 100%;
  background: var(--book-accent, var(--gold));
  border-radius: 2px;
}

.chev { color: var(--text-faint); flex-shrink: 0; }

/* ---------- Book detail ---------- */
.book-header {
  padding: 4px 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.book-header-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--book-accent, var(--gold));
  margin-bottom: 6px;
}

.book-header-title {
  font-family: var(--font-display);
  font-size: 24px;
  line-height: 1.15;
  margin-bottom: 8px;
}

.book-header-sub {
  color: var(--text-dim);
  font-size: 13.5px;
  line-height: 1.5;
}

.module-block { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.module-block:last-child { border-bottom: none; }

.module-title {
  font-family: var(--font-display);
  font-size: 15px;
  margin-bottom: 2px;
}

.module-desc {
  color: var(--text-dim);
  font-size: 12.5px;
  margin-bottom: 12px;
}

.chapter-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.chapter-row.available { cursor: pointer; }
.chapter-row.available:hover { border-color: var(--book-accent, var(--gold)); }
.chapter-row.locked { opacity: 0.5; }
.chapter-row.done { border-color: var(--success); }

.chapter-num {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-faint);
  width: 22px;
  flex-shrink: 0;
}

.chapter-title { font-size: 13.5px; flex: 1; }
.chapter-status { flex-shrink: 0; }

.badge-locked { color: var(--text-faint); font-size: 15px; }
.badge-done { color: var(--success); font-size: 15px; }

/* ---------- Chapter reader ---------- */
.reader { padding: 6px 20px 40px; }

.reader-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--book-accent, var(--gold));
  margin-bottom: 10px;
}

.reader-title {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1.15;
  margin-bottom: 14px;
}

.reader-hook {
  font-size: 15px;
  font-style: italic;
  color: var(--text);
  border-left: 3px solid var(--book-accent, var(--gold));
  padding: 4px 0 4px 14px;
  margin-bottom: 26px;
  line-height: 1.5;
}

.sec {
  margin-bottom: 22px;
}

.sec-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 8px;
}

.sec-body {
  font-size: 14.5px;
  line-height: 1.65;
  color: #E5E2DA;
}

.sec-body strong { color: var(--gold-bright); }
.sec-body em { color: var(--text); }

.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 16px;
}

.box.accent { border-color: var(--book-accent, var(--gold)); background: linear-gradient(160deg, var(--surface), var(--surface-2)); }

.resumo-list { margin: 0; padding-left: 18px; }
.resumo-list li { font-size: 14px; line-height: 1.55; margin-bottom: 6px; color: #E5E2DA; }

.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  line-height: 1.4;
  cursor: pointer;
}
.checklist-item:last-child { border-bottom: none; }

.checkbox {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--text-faint);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all .12s ease;
}
.checkbox.checked {
  background: var(--success);
  border-color: var(--success);
  color: #0B0F16;
  font-size: 12px;
  font-weight: 700;
}
.checklist-item.checked-text { color: var(--text-faint); text-decoration: line-through; }

.conclusao-box {
  border-left: 3px solid var(--gold);
  padding-left: 14px;
  font-size: 14.5px;
  line-height: 1.6;
  color: #E5E2DA;
}

.proximo-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--surface-2);
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-dim);
}
.proximo-box strong { color: var(--text); }

.complete-btn {
  width: 100%;
  margin-top: 28px;
  padding: 15px;
  border-radius: 999px;
  border: none;
  background: var(--gold);
  color: #0B0F16;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  transition: background .15s ease, transform .1s ease;
}
.complete-btn:active { transform: scale(0.98); }
.complete-btn.done { background: var(--success); }

.nav-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.nav-btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 13px;
  text-align: center;
}
.nav-btn:hover { color: var(--text); border-color: var(--gold); }
.nav-btn[disabled] { opacity: 0.35; pointer-events: none; }

/* ---------- Locked chapter state ---------- */
.locked-view {
  padding: 60px 30px;
  text-align: center;
  color: var(--text-dim);
}
.locked-view .lock-icon { font-size: 28px; margin-bottom: 14px; color: var(--text-faint); }
.locked-view p { font-size: 14px; line-height: 1.6; }

/* ---------- Footer credit ---------- */
.footer-credit {
  text-align: center;
  padding: 26px 20px 10px;
  color: var(--text-faint);
  font-size: 11.5px;
  letter-spacing: 0.03em;
}

/* ---------- Bottom navigation ---------- */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--max-w);
  display: flex;
  background: rgba(19,24,38,0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
}
.bn-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px;
  color: var(--text-faint);
  font-size: 10px;
  border-radius: 10px;
  transition: color .15s ease;
}
.bn-item.active { color: var(--gold); }
.bn-item:active { background: var(--surface-2); }

/* ---------- Stat row / level card ---------- */
.stat-row { display: flex; gap: 10px; padding: 0 20px 14px; }
.stat-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 13px;
  color: var(--text-dim);
}
.stat-chip strong { color: var(--text); font-family: var(--font-mono); }

.level-card {
  margin: 0 20px 16px;
  background: linear-gradient(135deg, var(--surface) 0%, #1A1522 55%, var(--surface) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.level-card::before {
  content: "";
  position: absolute;
  top: -40%; right: -20%;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(201,161,90,0.18), transparent 70%);
  pointer-events: none;
}
.level-card-top { display: flex; justify-content: space-between; margin-bottom: 8px; position: relative; }
.level-name { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; }
.level-xp { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.xp-track { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--rose)); border-radius: 4px; transition: width .5s ease; }

/* ---------- Mission card ---------- */
.mission-card {
  display: block;
  margin: 0 20px 22px;
  padding: 18px;
  border-radius: var(--radius);
  background: linear-gradient(155deg, var(--surface-2), var(--surface));
  border: 1px solid var(--book-accent, var(--gold));
  box-shadow: 0 14px 30px rgba(0,0,0,0.3), 0 0 40px -20px var(--book-accent, var(--gold));
  position: relative;
  overflow: hidden;
}
.mission-card.done { border-color: var(--success); }
.mission-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--book-accent, var(--gold));
  margin-bottom: 8px;
}
.mission-title { font-family: var(--font-display); font-size: 18px; line-height: 1.25; margin-bottom: 6px; }
.mission-meta { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
.mission-cta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--book-accent, var(--gold));
}

/* ---------- Goal card ---------- */
.goal-card { margin: 4px 20px 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.goal-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; }
.goal-track { display: flex; gap: 6px; }
.goal-dot { flex: 1; height: 8px; border-radius: 4px; background: var(--border); }
.goal-dot.active { background: var(--gold); }

/* ---------- Achievement strip (home) ---------- */
.ach-strip { display: flex; gap: 10px; padding: 0 20px 20px; overflow-x: auto; }
.ach-chip {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  white-space: nowrap;
}

/* ---------- Fav button ---------- */
.fav-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
}
.fav-btn.active { color: var(--gold); border-color: var(--gold); }
.topbar:has(.fav-btn) { justify-content: space-between; }

/* ---------- Reader tabs ---------- */
.reader-tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.rtab {
  background: none; border: none; padding: 10px 4px; margin-right: 18px;
  color: var(--text-faint); font-size: 13.5px; font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.rtab.active { color: var(--text); border-bottom-color: var(--book-accent, var(--gold)); }

/* ---------- Quiz ---------- */
.quiz-box { padding-bottom: 30px; }
.quiz-progress { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 10px; }
.quiz-question { font-family: var(--font-display); font-size: 18px; line-height: 1.3; margin-bottom: 18px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.quiz-option {
  text-align: left; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 13.5px; line-height: 1.4;
}
.quiz-option.selected { border-color: var(--book-accent, var(--gold)); }
.quiz-option.correct { border-color: var(--success); background: rgba(76,175,125,0.12); }
.quiz-option.wrong { border-color: var(--danger); background: rgba(196,99,79,0.12); }
.quiz-explain { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
.quiz-explain.ok { background: rgba(76,175,125,0.1); color: #9fd8b8; }
.quiz-explain.bad { background: rgba(196,99,79,0.1); color: #e0aa9d; }
.quiz-prev-result { margin-top: 10px; font-size: 11.5px; color: var(--text-faint); text-align: center; }

.quiz-result { text-align: center; padding: 40px 10px; }
.quiz-result-icon { font-size: 44px; margin-bottom: 10px; }
.quiz-result-title { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; }
.quiz-result-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }

/* ---------- Notes ---------- */
.notes-box { padding-bottom: 30px; }
.notes-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; }
.notes-textarea {
  width: 100%; min-height: 220px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; color: var(--text); font-family: var(--font-body);
  font-size: 14px; line-height: 1.6; resize: vertical;
}
.notes-textarea:focus { outline: none; border-color: var(--book-accent, var(--gold)); }
.notes-saved-hint { font-size: 11px; color: var(--text-faint); margin-top: 8px; text-align: right; }

/* ---------- Metric grid (desempenho) ---------- */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 20px 20px; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.metric-num { font-family: var(--font-display); font-size: 22px; color: var(--gold); }
.metric-label { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

.bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 60px; padding: 0 20px 24px; }
.bar { flex: 1; height: 14px; background: var(--border); border-radius: 3px; align-self: flex-end; transition: height .2s ease; }
.bar.active { height: 100%; background: var(--gold); }

.perf-book-row { display: flex; align-items: center; padding: 10px 0; font-size: 12.5px; }
.perf-book-row span:first-child { width: 90px; flex-shrink: 0; color: var(--text-dim); }
.perf-pct { font-family: var(--font-mono); font-size: 11px; width: 32px; text-align: right; }

/* ---------- Achievements grid ---------- */
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 20px 20px; }
.ach-card {
  background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border); border-radius: var(--radius);
  padding: 16px 12px; text-align: center; opacity: 0.45;
}
.ach-card.unlocked { opacity: 1; background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
.ach-card.unlocked.c0 { border-top-color: var(--book-gold); }
.ach-card.unlocked.c1 { border-top-color: var(--book-blue); }
.ach-card.unlocked.c2 { border-top-color: var(--book-teal); }
.ach-card.unlocked.c3 { border-top-color: var(--book-purple); }
.ach-card.unlocked.c4 { border-top-color: var(--book-crimson); }
.ach-card-icon { font-size: 26px; margin-bottom: 8px; filter: grayscale(1); }
.ach-card.unlocked .ach-card-icon { filter: none; }
.ach-card-name { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.ach-card-desc { font-size: 10.5px; color: var(--text-faint); line-height: 1.4; }

/* ---------- Gate banner ---------- */
.gate-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 4px 20px 20px;
  padding: 14px 14px;
  background: linear-gradient(135deg, rgba(201,161,90,0.1), rgba(155,127,199,0.06));
  border: 1px solid rgba(201,161,90,0.35);
  border-radius: var(--radius);
}
.gate-banner-icon { font-size: 18px; flex-shrink: 0; }
.gate-banner-text { flex: 1; font-size: 12px; line-height: 1.5; color: var(--text-dim); }
.gate-banner-text strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 3px; }
.gate-banner-close { flex-shrink: 0; background: none; border: none; color: var(--text-faint); padding: 2px; }

.badge-gate { color: var(--gold); opacity: 0.7; }
.chapter-row.gate-locked { opacity: 0.55; }
.chapter-gate-hint { display: block; font-size: 10px; color: var(--text-faint); margin-top: 2px; font-family: var(--font-mono); }

/* ---------- Profile ---------- */
.profile-header { text-align: center; padding: 10px 20px 24px; }
.profile-avatar {
  width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px;
  background: linear-gradient(160deg, var(--gold), #8a6a2e);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 24px; color: #0B0F16;
}
.profile-name-input {
  background: none; border: none; text-align: center; font-family: var(--font-display);
  font-size: 19px; color: var(--text); width: 100%; margin-bottom: 4px;
}
.profile-name-input:focus { outline: none; }
.profile-level { font-size: 12.5px; color: var(--gold); margin-bottom: 18px; }
.profile-stats-row { display: flex; justify-content: center; gap: 28px; }
.profile-stats-row div { display: flex; flex-direction: column; align-items: center; }
.profile-stats-row strong { font-family: var(--font-display); font-size: 18px; }
.profile-stats-row span { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

.profile-menu { margin: 0 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.profile-menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 16px; font-size: 13.5px; border-bottom: 1px solid var(--border); cursor: pointer; color: var(--text);
}
.profile-menu-item:last-child { border-bottom: none; }
.profile-menu-item:hover { background: var(--surface-2); }

.note-list-item { display: block; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.note-list-item:last-child { border-bottom: none; }
.note-list-preview { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; }

/* ---------- Book header extras ---------- */
.book-cover-hero { width: 96px; margin: 0 auto 14px; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
.book-cover-hero svg { display: block; width: 100%; height: auto; }
.book-header { text-align: center; }
.book-header .book-header-sub { max-width: 34ch; margin: 0 auto; }
.book-card-pct { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; }
.cover-art.small { width: 54px; height: 79px; flex-shrink: 0; border-radius: 6px; }

/* ---------- Toast ---------- */
.toast-box {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 100; width: 100%; max-width: 420px; padding: 0 20px;
  pointer-events: none;
}
.toast {
  background: var(--surface-2); border: 1px solid var(--gold); border-radius: 999px;
  padding: 10px 18px; font-size: 13px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  opacity: 0; transform: translateY(10px); transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-icon { font-size: 15px; }

/* ---------- Adjust app padding for bottom nav ---------- */
#app { padding-bottom: 0; }

.view-enter {
  animation: fadeUp .28s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .view-enter { animation: none; }
}

/* focus visibility */
a:focus-visible, button:focus-visible, .chapter-row:focus-visible, .book-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
// =====================================================
// MÉTODO VENDAS DE ELITE — Jeferson Reis
// Base de conteúdo do app
// =====================================================

const COLLECTION = {
  author: "Jeferson Reis",
  title: "Método Vendas de Elite",
  tagline: "Disciplina, comunicação e fechamento para quem vive de vender.",
};

// ---------- Capas dos livros (SVG vetorial, sem dependência de imagens externas) ----------
function coverBase(accent, accentSoft, pattern, numero, titulo, linhas) {
  const linhasHTML = linhas.map((l, i) =>
    `<tspan x="28" dy="${i === 0 ? 0 : 40}">${l}</tspan>`
  ).join("");
  return `
  <svg viewBox="0 0 300 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${titulo}">
    <defs>
      <linearGradient id="bg-${numero}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0B0F16"/>
        <stop offset="100%" stop-color="#141A26"/>
      </linearGradient>
      <linearGradient id="glow-${numero}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="300" height="440" fill="url(#bg-${numero})"/>
    <rect width="300" height="200" fill="url(#glow-${numero})"/>
    ${pattern}
    <rect x="0" y="0" width="300" height="440" fill="none" stroke="${accentSoft}" stroke-width="1"/>
    <text x="28" y="46" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="${accent}">MÉTODO VENDAS DE ELITE</text>
    <text x="28" y="66" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#5C6579">LIVRO ${String(numero).padStart(2,"0")}</text>
    <text font-family="Oswald, sans-serif" font-weight="600" font-size="34" fill="#F2F0EA" x="28" y="330">${linhasHTML}</text>
    <line x1="28" y1="380" x2="70" y2="380" stroke="${accent}" stroke-width="2"/>
    <text x="28" y="404" font-family="Oswald, sans-serif" font-size="13" letter-spacing="1.5" fill="#9AA3B2">JEFERSON REIS</text>
  </svg>`;
}

const CAPAS = {
  l1: coverBase("#C9A15A", "#3a2f1a", `
      <g opacity="0.5" stroke="#C9A15A" stroke-width="1">
        <circle cx="150" cy="120" r="70" fill="none"/>
        <circle cx="150" cy="120" r="90" fill="none" opacity="0.5"/>
        <circle cx="150" cy="120" r="110" fill="none" opacity="0.25"/>
      </g>`,
    1, "O Ritual Diário do Vendedor", ["O RITUAL", "DIÁRIO DO", "VENDEDOR"]),
  l2: coverBase("#5B8DBE", "#1c2a38", `
      <g opacity="0.45" stroke="#5B8DBE" stroke-width="1">
        <line x1="0" y1="60" x2="300" y2="60"/><line x1="0" y1="100" x2="300" y2="100"/>
        <line x1="0" y1="140" x2="300" y2="140"/><line x1="0" y1="180" x2="300" y2="180"/>
        <line x1="60" y1="0" x2="60" y2="220"/><line x1="150" y1="0" x2="150" y2="220"/>
        <line x1="240" y1="0" x2="240" y2="220"/>
      </g>`,
    2, "Fundamentos da Venda de Alta Performance", ["FUNDAMENTOS", "DA VENDA DE", "ALTA", "PERFORMANCE"]),
  l3: coverBase("#4FA7A0", "#1a2e2c", `
      <g opacity="0.5" stroke="#4FA7A0" stroke-width="1.5" fill="none">
        <path d="M20,80 Q75,40 130,80 T240,80"/>
        <path d="M20,110 Q75,150 130,110 T240,110"/>
        <path d="M20,140 Q75,100 130,140 T240,140"/>
      </g>`,
    3, "Conversas que Vendem", ["CONVERSAS", "QUE VENDEM"]),
  l4: coverBase("#9B7FC7", "#2a2338", `
      <g opacity="0.5" stroke="#9B7FC7" stroke-width="1" fill="none">
        <circle cx="150" cy="110" r="8"/><circle cx="90" cy="70" r="4"/><circle cx="210" cy="70" r="4"/>
        <circle cx="60" cy="140" r="4"/><circle cx="240" cy="140" r="4"/><circle cx="150" cy="180" r="4"/>
        <line x1="150" y1="110" x2="90" y2="70"/><line x1="150" y1="110" x2="210" y2="70"/>
        <line x1="150" y1="110" x2="60" y2="140"/><line x1="150" y1="110" x2="240" y2="140"/>
        <line x1="150" y1="110" x2="150" y2="180"/>
      </g>`,
    4, "Psicologia da Persuasão e Conversão", ["PSICOLOGIA", "DA PERSUASÃO", "E CONVERSÃO"]),
  l5: coverBase("#C4634F", "#3a241d", `
      <g opacity="0.5" stroke="#C4634F" stroke-width="1">
        <line x1="0" y1="200" x2="130" y2="20"/>
        <line x1="60" y1="200" x2="190" y2="20"/>
        <line x1="120" y1="200" x2="250" y2="20"/>
        <line x1="180" y1="200" x2="300" y2="30"/>
      </g>`,
    5, "Negociação e Fechamento de Elite", ["NEGOCIAÇÃO", "E FECHAMENTO", "DE ELITE"]),
};

// ---------- Ajuda para montar capítulos rapidamente ----------
function chapter(id, num, title, hook, sections) {
  return { id, num, title, hook, ...sections, locked: false };
}

function lockedChapter(id, num, title) {
  return { id, num, title, locked: true };
}

// =====================================================
// LIVRO 01 — O RITUAL DIÁRIO DO VENDEDOR
// =====================================================

const dia1 = chapter(
  "l1d1", 1,
  "Você é o Responsável, Não a Meta",
  "Ninguém vai bater sua meta por você. Nem seu gestor, nem o CRM, nem a sorte.",
  {
    tempoEstimado: 6,
    quiz: [
      { q: "Segundo o capítulo, qual é a primeira pergunta que o vendedor de elite faz diante de um resultado ruim?", options: ["\"De quem é a culpa?\"", "\"O que dependia de mim aqui, e eu fiz?\"", "\"Quando o mercado vai melhorar?\""], correct: 1, explain: "O foco é sempre no que estava sob seu controle antes de olhar pro resto." },
      { q: "Segundo o exemplo do capítulo, o que realmente mudou entre o mês fraco e o mês forte?", options: ["A qualidade dos leads recebidos", "A forma como ele tratava cada contato", "O tamanho da equipe"], correct: 1, explain: "Mesma matéria-prima, dono diferente do processo — o tratamento mudou, não o lead." },
      { q: "Qual dessas frases o capítulo pede pra você eliminar do vocabulário?", options: ["\"O que eu posso fazer agora?\"", "\"O lead veio ruim\"", "\"Vou registrar minha atividade\""], correct: 1, explain: "Terceirizar a culpa pro lead tira você do volante do próprio resultado." },
    ],
    introducao: `Todo mês tem um dia em que o painel de metas fica vermelho e a cabeça começa a procurar
    culpado: o lead que não respondeu, o sistema que caiu, o horário ruim, a concorrência mais barata.
    Eu já procurei todos esses culpados. Funcionou por uns dias — a culpa alivia na hora, mas não vende
    nada. Esse é o primeiro ritual: parar de terceirizar o resultado.`,
    desenvolvimento: `Existem dois tipos de vendedor sentados na mesma cadeira.
    <br><br>
    O primeiro dirige o próprio mês: decide quantos contatos vai fazer, decide como vai reagir a um "não",
    decide o que vai estudar essa semana. O segundo é passageiro do próprio resultado: espera a empresa mandar
    lead melhor, espera o mercado melhorar, espera o gestor motivar.
    <br><br>
    A diferença entre os dois não é talento. É <strong>quem segura o volante</strong>.
    <br><br>
    Isso não significa que fatores externos não existem — lead ruim existe, sistema trava, cliente é grosso
    às vezes. Mas o vendedor de elite pergunta primeiro: <em>"o que dependia de mim aqui, e eu fiz?"</em>
    Só depois olha pro resto.`,
    exemplos: `Imagine fechar um mês fraco dizendo "os leads desse mês vieram ruins". Três meses depois, mesmo
    tipo de lead, o resultado dobra. O que mudou não foi a base — foi parar de esperar lead perfeito e
    passar a tratar cada contato como se fosse o único do dia. Eu já vi isso acontecer várias vezes: mesma
    matéria-prima, resultado completamente diferente, porque mudou quem estava no comando do processo.`,
    aplicacao: `Antes de abrir o CRM hoje, responda em voz alta: <em>"De quem é a responsabilidade pelo meu
    resultado hoje?"</em> Se a resposta não for "minha", você ainda está no banco de trás.`,
    resumo: [
      "Culpar fator externo alivia por um instante e não vende nada.",
      "Vendedor de elite pergunta primeiro o que dependia dele.",
      "Mesma base de leads, resultado diferente — o que muda é quem dirige o processo.",
    ],
    checklist: [
      "Registrei minhas atividades de hoje sem justificar números com fatores externos",
      "Fiz pelo menos 1 contato difícil que eu estava evitando",
      "Separei o que dependia de mim do que não dependia — e agi só sobre o primeiro",
      "Não usei a frase \"o lead veio ruim\" hoje",
    ],
    exercicio: `Escreva 3 coisas do seu resultado desse mês que dependem 100% de você (não do lead, não do
    gestor, não do sistema). Cole essa lista onde você vê todo dia.`,
    missao: `Hoje, pelo menos uma vez que a vontade for culpar algo externo, troque a frase por: "o que eu
    posso fazer agora mesmo?" Faça isso valendo, não só na cabeça.`,
    conclusao: `Você não controla se o cliente vai responder. Controla se vai mandar a mensagem. Não controla
    se o mês vai ser fácil. Controla se vai continuar depois do quinto "não". O ritual começa aqui: assumir o
    volante antes de cobrar velocidade.`,
    proximoPasso: `Amanhã: o que fazer quando o cliente simplesmente some — sem highlighter, sem drama.`,
  }
);

const dia2 = chapter(
  "l1d2", 2,
  "Ignorado Não é Rejeitado",
  "Silêncio no WhatsApp não é um \"não\". É só silêncio.",
  {
    tempoEstimado: 5,
    quiz: [
      { q: "Qual a diferença central entre rejeição e silêncio, segundo o capítulo?", options: ["Não existe diferença, ambos significam \"não\"", "Rejeição é explícita; silêncio é apenas ausência de resposta", "Silêncio é sempre pior que rejeição"], correct: 1, explain: "Rejeição é uma resposta clara. Silêncio pode ter dezenas de causas diferentes." },
      { q: "Qual mensagem de reengajamento o capítulo recomenda evitar?", options: ["Uma com gancho novo, tipo condição especial", "\"Você viu minha mensagem?\"", "Uma pergunta genuína sobre a decisão"], correct: 1, explain: "Cobrança direta soa inconveniente e reforça o silêncio." },
      { q: "Quantas tentativas de reengajamento o capítulo sugere estruturar, no mínimo?", options: ["1", "3", "10"], correct: 1, explain: "Pelo menos 3 tentativas espaçadas, cada uma com gancho diferente." },
    ],
    introducao: `Lead visualiza e não responde. Cliente some depois do orçamento. Prospect lê o áudio e
    desaparece. Se você vende pelo WhatsApp, isso acontece todos os dias — e é a maior fonte de desânimo
    silencioso da profissão.`,
    desenvolvimento: `O erro está em traduzir silêncio como rejeição. São coisas diferentes.
    <br><br>
    Rejeição é quando o cliente diz claramente que não quer. Silêncio é só... silêncio. Pode ser o cliente
    ocupado, inseguro, comparando preço, esperando o salário cair, ou simplesmente adiando uma decisão que
    ele mesmo ainda não tomou dentro da cabeça dele.
    <br><br>
    Vendedor iniciante trata os dois como se fossem a mesma coisa e desiste no primeiro silêncio. Vendedor de
    elite sabe que <strong>follow-up bem feito fatura mais que abordagem</strong> — porque a maioria desiste
    cedo demais, e sobra menos gente competindo pela atenção do cliente depois do terceiro dia.`,
    exemplos: `Imagine um lead que sumiu depois do orçamento de um plano. Quatro dias depois, sem cobrança, sem
    pressão, uma mensagem assim: "Oi, seu Marcos! Separei uma condição que pode te interessar antes de
    fechar o mês — quer que eu te mande?". O cliente responde na hora. Ele não tinha sumido por
    desinteresse — só estava esperando o dia do pagamento. Eu já vi negócio fechar exatamente assim,
    dias depois do que parecia silêncio definitivo.`,
    aplicacao: `Regra prática: nenhum lead morre no primeiro silêncio. Estruture pelo menos 3 tentativas de
    reengajamento espaçadas, cada uma com um gancho diferente (nunca "e aí, conseguiu ver?").`,
    resumo: [
      "Silêncio ≠ rejeição. Rejeição é explícita, silêncio é só ausência de resposta.",
      "A maioria desiste cedo — isso abre espaço pra quem persiste com classe.",
      "Follow-up não é insistência chata, é continuar oferecendo valor com gancho novo.",
    ],
    checklist: [
      "Revisei minha lista de leads \"sumidos\" dos últimos 7 dias",

      { q: "No exemplo do capítulo, o que se revela ao perguntar \"o que te motivou a buscar isso agora?\"", options: ["Nada relevante geralmente", "Frequentemente revela o motivo emocional ou prático real por trás da busca, além do que foi dito inicialmente", "Sempre revela só o orçamento disponível"], correct: 1, explain: "Essa pergunta convida o cliente a revelar o motivo mais profundo, que muitas vezes vai além do que foi dito de início." },
    ],
    introducao: `O cliente que diz "quero um produto mais barato" pode, na verdade, estar buscando

    capítulo é sobre perguntas que revelam o que está por trás do que foi dito.`,
    desenvolvimento: `Muitas vezes o próprio cliente não tem total clareza da própria necessidade real —

    Perguntas abertas que exploram contexto, motivo e impacto tendem a revelar essa camada mais profunda.
    "O que te motivou a buscar isso agora?" convida o cliente a contar a história por trás da busca —
    muitas vezes revelando um motivo emocional ou prático que não tinha sido dito antes.
    <br><br>
    Outras perguntas úteis: "Como isso impactaria seu dia a dia se resolvido?", "O que você já tentou
    antes que não funcionou?", "Se pudesse resolver isso perfeitamente, como seria?". Cada uma abre uma
    porta diferente pra entender o que realmente está em jogo.`,
    exemplos: `Um cliente diz que quer "o produto mais barato disponível". Ao perguntar "o que te

    específica — e não que valoriza pouco o produto. Essa informação muda tudo: em vez de discutir preço,

    aplicacao: `Na próxima negociação, use pelo menos uma pergunta de contexto ou motivo antes de aceitar

    resumo: [

      "Perguntas abertas de contexto, motivo e impacto revelam a camada mais profunda por trás do que foi dito.",
      "Entender o motivo real muda completamente a forma de conduzir a negociação.",
    ],
    checklist: [
      "Usei uma pergunta de contexto ou motivo antes de aceitar a necessidade declarada como completa",
      "Descobri uma necessidade oculta por trás do que o cliente disse inicialmente hoje",
      "Ajustei minha abordagem depois de entender o motivo real do cliente",

    exercicio: `Escolha uma negociação em andamento. Escreva 2 perguntas de contexto/motivo que você

    missao: `Hoje, em pelo menos uma negociação, use uma pergunta de contexto/motivo antes de apresentar

const l5c10 = chapter(
  "l5c10", 10,
  "Frases Persuasivas",
  "Certas frases carregam peso psicológico maior — não por mágica, por como o cérebro processa linguagem.",
  {
    tempoEstimado: 7,
    quiz: [
      { q: "Segundo o capítulo, por que certas frases têm mais impacto persuasivo que outras equivalentes?", options: ["Por sorte", "Porque ativam padrões de processamento do cérebro relacionados a pertencimento, escassez ou autoridade", "Porque são mais longas"], correct: 1, explain: "Frases persuasivas ativam padrões psicológicos reais, não são só coincidência de palavras bonitas." },
      { q: "Qual é o cuidado ético que o capítulo destaca sobre o uso dessas frases?", options: ["Não existe cuidado nenhum, use como quiser", "Usar de forma verdadeira, nunca criando urgência ou escassez falsa", "Usar sempre com pressão máxima"], correct: 1, explain: "O capítulo é enfático: essas frases só devem ser usadas quando o conteúdo por trás é verdadeiro, nunca como mentira." },
      { q: "No exemplo do capítulo, o que a frase \"pessoas como você geralmente preferem...\" ativa no cliente?", options: ["Nenhum efeito real", "Um senso de pertencimento a um grupo que já tomou uma decisão parecida", "Apenas curiosidade sobre outras pessoas"], correct: 1, explain: "Essa frase ativa o desejo de pertencimento, mostrando que outras pessoas parecidas já decidiram de forma semelhante." },
    ],
    introducao: `Algumas frases carregam mais peso persuasivo que outras equivalentes — não por mágica,
    mas porque ativam padrões reais de como o cérebro processa linguagem. Um aviso antes de qualquer
    exemplo: use sempre com verdade, nunca como mentira.`,
    desenvolvimento: `<strong>Pertencimento:</strong> "Pessoas como você geralmente preferem..." ativa o
    desejo de se identificar com um grupo que já decidiu de forma parecida.
    <br><br>
    <strong>Escassez real</strong> (nunca falsa): "Essa condição específica vale até [data real]" — cria
    senso de urgência genuína, sem inventar prazo que não existe.
    <br><br>
    <strong>Autoridade:</strong> "Depois de [tempo/experiência real], percebi que..." — reforça
    credibilidade baseada em experiência genuína, não em afirmação vazia.
    <br><br>
    <strong>Prova social real:</strong> "A maioria dos meus clientes em situação parecida escolheu..." —
    usa exemplo real de outros clientes pra reforçar uma decisão, sem inventar número ou caso.
    <br><br>
    <strong>Antecipação positiva:</strong> "Imagina só like vai ser quando isso estiver resolvido" —
    convida o cliente a visualizar o resultado positivo, o que fortalece o desejo de decidir.
    <br><br>
    O ponto central: cada uma dessas frases só deve ser usada quando o conteúdo por trás é
    verdadeiro. Escassez inventada ou prova social falsa, além de antiéticas, tendem a ser percebidas
    pelo cliente mais cedo ou mais tarde — e destroem a confiança construída.`,
    exemplos: `Imagine ter uma condição especial que realmente vale só até sexta-feira (fato real, não
    invenção). Dizer "essa condição vale até sexta" é honesto e ainda assim persuasivo — porque é
    verdade. Inventar uma data falsa pra criar pressão artificial é o tipo de atalho que, descoberto,
    custa a confiança de qualquer cliente pro resto da relação.`,
    aplicacao: `Escolha uma dessas categorias de frase persuasiva (pertencimento, escassez real,
    autoridade, prova social real, antecipação positiva) e aplique com honestidade na próxima negociação.`,
    resumo: [
      "Frases persuasivas ativam padrões reais de processamento psicológico — pertencimento, escassez, autoridade.",
      "O uso ético exige que o conteúdo por trás da frase seja sempre verdadeiro.",
      "Escassez ou prova social falsas, quando descobertas, destroem a confiança construída.",
    ],
    checklist: [
      "Usei pelo menos uma frase persuasiva com conteúdo 100% verdadeiro hoje",
      "Não inventei nenhuma escassez ou prazo falso numa negociação",
      "Usei prova social real (caso genuíno de outro cliente) quando aplicável",
      "Convidei o cliente a visualizar o resultado positivo numa conversa",
    ],
    exercicio: `Escolha 2 categorias de frase persuasiva (das 5 listadas) e escreva uma versão adaptada
    ao seu produto/serviço, sempre com conteúdo verdadeiro por trás.`,
    missao: `Hoje, use conscientemente pelo menos uma frase persuasiva com conteúdo genuíno numa
    negociação real.`,
    conclusao: `Persuasão não é manipulação quando o que está por trás da frase é verdade. É só comunicar
    com mais clareza algo que já é real — e isso faz toda a diferença no impacto da mensagem.`,
    proximoPasso: `A seguir: como defender valor sem entrar em guerra de preço.`,
  }
);

const l5c11 = chapter(
  "l5c11", 11,
  "Defendendo Valor Sem Guerra de Preço",
  "Quem entra em guerra de preço já perdeu — porque sempre existe alguém disposto a cobrar menos.",
  {
    tempoEstimado: 8,
    quiz: [
      { q: "Segundo o capítulo, por que entrar em guerra de preço tende a ser uma estratégia perdedora?", options: ["Porque preço nunca importa pro cliente", "Porque sempre pode existir alguém disposto a cobrar ainda menos, tornando a disputa insustentável", "Porque é ilegal competir por preço"], correct: 1, explain: "Guerra de preço é insustentável porque sempre pode aparecer alguém dispostos a cobrar menos ainda." },
      { q: "Qual é a alternativa recomendada pelo capítulo à guerra de preço?", options: ["Sempre ser o mais barato do mercado", "Deslocar a conversa de preço para o valor e os diferenciais reais entregues", "Ignorar completamente o assunto preço"], correct: 1, explain: "Deslocar a conversa para valor e diferenciais reais tira a negociação da comparação simples de números." },
      { q: "No exemplo do capítulo, qual pergunta ajuda a reposicionar uma objeção de preço para valor?", options: ["\"Quanto você quer pagar?\"", "\"Você busca o preço mais baixo ou a melhor solução pro seu problema?\"", "\"Por que você acha caro?\""], correct: 1, explain: "Essa pergunta desloca a comparação de preço isolado para o que realmente importa: resolver o problema do cliente." },
    ],
    introducao: `Toda vez que a negociação vira só uma disputa de quem cobra menos, você já está numa
    briga que não pode ganhar de forma sustentável — porque sempre existe alguém dispostos a cobrar ainda
    menos.`,
    desenvolvimento: `Guerra de preço corrói margem, corrói percepção de qualidade, e ainda assim nunca
    garante vitória definitiva — porque a concorrência pode sempre baixar mais um pouco. A alternativa
    sustentável é deslocar a conversa de preço isolado pra valor e diferenciais reais entregues.
    <br><br>
    Uma pergunta poderosa nesse reposicionamento: "Você busca o preço mais baixo, ou a melhor solução pro
    seu problema?". Ela não ignora a preocupação com preço — ela amplia a conversa pra incluir o que
    realmente importa: resolver o problema do cliente.
    <br><br>
    Isso exige, claro, que os diferenciais sejam reais e bem comunicados — suporte, qualidade,
    experiência, garantia, atendimento. Defender valor sem ter valor real por trás é só disfarce; com
    valor real, é apenas comunicação honesta do que está sendo oferecido.`,
    exemplos: `Um cliente diz "encontrei mais barato em outro lugar". Em vez de imediatamente abaixar o
    preço, a resposta pode ser: "Entendo — você acredita que essa outra opção entrega o mesmo nível de
    [diferencial específico: suporte, garantia, qualidade]?". Isso não nega o preço menor do concorrente,
    mas traz de volta o foco pro que realmente importa na decisão.`,
    aplicacao: `Na próxima objeção de preço, use a pergunta "você busca o menor preço ou a melhor
    solução?" antes de considerar qualquer desconto.`,
    resumo: [
      "Guerra de preço é insustentável — sempre pode existir alguém disposto a cobrar menos.",
      "A alternativa é deslocar a conversa de preço isolado para valor e diferenciais reais.",
      "Isso exige que os diferenciais comunicados sejam genuínos, não apenas discurso vazio.",
    ],
    checklist: [
      "Usei a pergunta \"preço menor ou melhor solução\" numa objeção de preço hoje",
      "Comuniquei um diferencial real, não genérico, numa negociação",
      "Não entrei em guerra de preço direta com concorrente hoje",
      "Reposicionei pelo menos uma conversa de preço para o campo do valor",
    ],
    exercicio: `Liste os 3 diferenciais reais mais fortes do que você vende. Escreva como comunicaria
    cada um deles na próxima vez que receber uma objeção de preço.`,
    missao: `Hoje, na próxima objeção de preço que receber, teste reposicionar a conversa pro valor
    antes de considerar qualquer desconto.`,
    conclusao: `Quem compete só em preço, disputa uma corrida que não tem linha de chegada. Quem defende
    valor real, constrói uma vantagem que a concorrência não consegue simplesmente igualar baixando o
    número.`,
    proximoPasso: `A seguir: como virar objeções em motivos de compra, não em obstáculos.`,
  }
);

const l5c12 = chapter(
  "l5c12", 12,
  "Virando Objeções em Motivos de Compra",
  "A mesma objeção que afasta um vendedor despreparado pode ser o gatilho que fecha pra quem sabe usá-la.",
  {
    tempoEstimado: 8,
    quiz: [
      { q: "Segundo o capítulo, o que significa \"virar uma objeção em motivo de compra\"?", options: ["Ignorar a objeção completamente", "Reformular a preocupação do cliente de forma que ela se torne razão para decidir, não para recuar", "Discordar do cliente até ele desistir da objeção"], correct: 1, explain: "A técnica reformula a mesma preocupação de forma que ela aponte para a decisão, em vez de contra ela." },
      { q: "No exemplo do capítulo sobre \"vou esperar juntar mais dinheiro\", qual reformulação vira isso em motivo de compra?", options: ["Concordar que é melhor esperar mesmo", "Mostrar que resolver agora evita o problema crescer ou custar mais caro depois", "Ignorar a objeção e mudar de assunto"], correct: 1, explain: "Mostrar o custo de esperar reformula a objeção de tempo em um motivo pra agir agora." },
      { q: "Segundo o capítulo, qual é o cuidado ético ao aplicar essa técnica?", options: ["Nenhum cuidado necessário", "A reformulação precisa ser genuína e verdadeira, nunca uma pressão artificial ou mentira", "Sempre usar urgência extrema, verdadeira ou não"], correct: 1, explain: "A técnica só é ética quando a reformulação reflete uma verdade real, não uma pressão inventada." },
    ],
    introducao: `A mesma objeção que faz um vendedor despreparado desistir pode, reformulada com
    honestidade, virar exatamente o motivo que leva o cliente a decidir. Esse capítulo é sobre como fazer
    essa virada.`,
    desenvolvimento: `Virar uma objeção em motivo de compra não significa discordar do cliente ou
    ignorar a preocupação dele — significa reformular a mesma questão de forma que ela aponte pra decisão,
    em vez de apontar pra recuo.
    <br><br>
    Objeção: "vou esperar juntar mais dinheiro". Reformulação honesta: "faz sentido querer se planejar —
    só vale considerar que esperar pode significar [o problema crescer, o custo aumentar, a oportunidade
    passar]. Faz sentido resolver agora e se planejar dentro da solução, em vez de esperar?".
    <br><br>
    Objeção: "não é prioridade agora". Reformulação: "entendo — mas o que normalmente acontece é que,
    quando vira prioridade urgente, as opções ficam mais limitadas e caras. Faz sentido resolver com calma

    genuinamente existe, a oportunidade genuinamente pode passar. Usar isso como pressão artificial sobre
    algo que não é verdade quebra a confiança e mina qualquer relação de longo prazo.`,
    exemplos: `Um cliente diz "não é prioridade agora" sobre um problema que, sabidamente, tende a piorar
    com o tempo (um problema estrutural, por exemplo). A reformulação genuína — "esse tipo de problema
    tende a ficar mais caro de resolver quanto mais tempo passa, faz sentido resolver com calma agora?" —
    não é pressão, é informação real que ajuda o cliente a decidir com mais clareza.`,
    aplicacao: `Na próxima objeção relacionada a tempo ou prioridade, identifique se existe um custo real
    de esperar. Se existir, reformule a objeção mostrando esse custo com honestidade.`,
    resumo: [
      "Virar objeção em motivo de compra é reformular a mesma preocupação apontando pra decisão.",
      "Objeções de tempo/dinheiro/prioridade costumam ter uma reformulação honesta baseada em custo real de esperar.",
      "A técnica só é ética quando reflete verdade genuína, nunca pressão artificial.",
    ],
    checklist: [
      "Reformulei pelo menos uma objeção em motivo de compra hoje, com honestidade",
      "Identifiquei um custo real de esperar antes de usar essa técnica",
      "Não usei nenhuma pressão artificial ou informação falsa numa negociação",
      "Ajudei o cliente a decidir com mais clareza através de uma reformulação genuína",
    ],
    exercicio: `Pegue as 2 objeções mais comuns que você recebe relacionadas a tempo/prioridade. Escreva

    missao: `Hoje, na próxima objeção de tempo ou prioridade, teste a reformulação honesta antes de
    aceitar como resposta final.`,
    conclusao: `A diferença entre manipular e ajudar a decidir está na verdade por trás da reformulação.
    Usada com honestidade, essa técnica não força ninguém — só ilumina uma informação que o cliente
    precisava considerar.`,
    proximoPasso: `A seguir: como encerrar a conversa sem parecer ansioso, mesmo depois de um bom
    trabalho de reformulação.`,
  }

const l5c13 = chapter(
  "l5c13", 13,
  "Encerrando Sem Parecer Ansioso",
  "A pressa no fechamento é sentida pelo cliente antes de qualquer palavra ser dita.",
  {
    tempoEstimado: 6,
    quiz: [
      { q: "Segundo o capítulo, o que o cliente costuma sentir quando o vendedor demonstra ansiedade no momento de fechar?", options: ["Isso sempre acelera a decisão", "Desconfiança, porque ansiedade sugere que algo pode não estar certo", "O cliente não percebe nada"], correct: 1, explain: "Ansiedade percebida no fechamento tende a gerar desconfiança, não pressa positiva." },
      { q: "Qual prática o capítulo recomenda para reduzir a ansiedade real antes de um fechamento importante?", options: ["Pensar constantemente na meta durante a conversa", "Técnicas de respiração e foco no processo, não no resultado, durante a condução final", "Evitar qualquer fechamento até se sentir 100% calmo"], correct: 1, explain: "Técnicas de respiração e foco no processo ajudam a reduzir a ansiedade real, não só escondê-la." },
      { q: "Segundo o capítulo, o que fazer depois de fazer a pergunta de fechamento?", options: ["Continuar falando pra reforçar a decisão", "Ficar em silêncio, dando espaço para o cliente processar e responder", "Repetir a pergunta imediatamente"], correct: 1, explain: "Silêncio funcional depois da pergunta de fechamento dá espaço real pro cliente decidir, sem pressão adicional." },
    ],
    introducao: `O momento de fechar é onde a ansiedade mais aparece — e é exatamente onde ela mais
    atrapalha. O cliente sente a pressa antes de qualquer palavra ser dita.`,
    desenvolvimento: `Ansiedade no fechamento vaza em sinais sutis: fala mais rápida, mensagens em
    sequência sem esperar resposta, tom de voz mais agudo. O cliente sente isso — e a reação natural é
    desconfiança, não urgência positiva.
    <br><br>
    Reduzir a ansiedade real (não só escondê-la) exige duas práticas: respiração consciente antes do
    momento de fechamento, e foco deliberado no processo (fazer bem aquele fechamento específico) em vez
    de no resultado (bater a meta, fechar aquele valor).
    <br><br>
    Depois de fazer a pergunta de fechamento, o silêncio é sua ferramenta mais poderosa. Ficar quieto,
    resistindo ao impulso de preencher o silêncio com mais argumento, dá ao cliente o espaço real que ele
    precisa pra processar e decidir — sem sentir que está sendo empurrado.`,
    exemplos: `Depois de perguntar "fechamos então?", a tentação é continuar falando se o cliente demora
    alguns segundos pra responder. Resistir a esse impulso e simplesmente esperar, mesmo que o silêncio
    pareça desconfortável, costuma trazer uma resposta mais genuína do que preencher o vazio com mais
    argumento — que pode soar como insegurança ou pressão.`,
    aplicacao: `No próximo fechamento, pratique respirar conscientemente antes de fazer a pergunta final,
    e depois de perguntar, permaneça em silêncio até o cliente responder — mesmo que pareça longo.`,
    resumo: [
      "Ansiedade no fechamento vaza em sinais sutis que o cliente percebe e associa a desconfiança.",
      "Respiração consciente e foco no processo (não no resultado) reduzem a ansiedade real.",
      "Silêncio depois da pergunta de fechamento dá espaço genuíno pro cliente decidir.",
    ],
    checklist: [
      "Respirei conscientemente antes de um momento de fechamento hoje",
      "Mantive silêncio depois de uma pergunta de fechamento, sem preencher o vazio",
      "Foquei no processo do fechamento, não no resultado da meta, durante a condução",
      "Não deixei a ansiedade acelerar minha fala num momento importante",
    ],
    exercicio: `Lembre de um fechamento em que a ansiedade te fez continuar falando depois da pergunta
    final. O que teria acontecido se você tivesse simplesmente esperado em silêncio?`,
    missao: `Hoje, pratique o silêncio funcional depois de toda pergunta de fechamento, resistindo ao
    impulso de preencher o vazio.`,
    conclusao: `Segurança no fechamento não vem de falar mais — vem de confiar no trabalho já feito antes
    daquele momento, e permitir que o cliente tenha o espaço de decidir sem pressão.`,
    proximoPasso: `A seguir: como criar urgência real, sem empurrar ou inventar pressão artificial.`,
  }
);

const l5c14 = chapter(
  "l5c14", 14,
  "Criando Urgência Sem Empurrar",
  "Urgência verdadeira convence. Urgência inventada, cedo ou tarde, é descoberta — e custa caro.",
  {
    tempoEstimado: 7,
    quiz: [
      { q: "Segundo o capítulo, qual é a diferença entre urgência real e urgência empurrada?", options: ["Não existe diferença, ambas funcionam igual", "Urgência real reflete um fato genuíno; urgência empurrada é inventada apenas para pressionar", "Urgência empurrada é sempre mais eficaz"], correct: 1, explain: "A distinção central é a veracidade: urgência real existe de fato; a empurrada é fabricada só pra gerar pressão." },
      { q: "Qual é o risco de longo prazo de usar urgência falsa repetidamente?", options: ["Nenhum risco real", "O cliente eventualmente percebe o padrão e perde a confiança em futuras comunicações", "Isso sempre aumenta as vendas seguintes"], correct: 1, explain: "Urgência falsa repetida mina a credibilidade de comunicações futuras, mesmo quando a urgência for real depois." },
      { q: "Segundo o capítulo, qual é uma fonte legítima de urgência real numa negociação?", options: ["Inventar um prazo qualquer", "Uma condição especial que realmente expira, ou uma situação do cliente que realmente piora com o tempo", "Dizer que é a última unidade mesmo tendo estoque"], correct: 1, explain: "Urgência legítima vem de fatos reais — condição que realmente expira, ou situação que realmente se agrava com o tempo." },
    ],
    introducao: `Urgência é uma das ferramentas mais poderosas de persuasão — e uma das mais arriscadas
    quando usada de forma falsa. Esse capítulo é sobre como criar urgência real, sem empurrar.`,
    desenvolvimento: `Urgência real reflete um fato genuíno: uma condição especial que realmente tem

const STORAGE_KEY = "mve_progress_v2";

function todayKey(d) {
  const date = d || new Date();
  return date.toISOString().slice(0, 10);
}

function defaultProgress() {
  return {
    done: {},              // chapterId -> true
    checklist: {},         // chapterId -> { idx: bool }
    notes: {},             // chapterId -> string
    favorites: {},         // chapterId -> true
    quizResults: {},       // chapterId -> { correct, total, perfect }
    xp: 0,
    activityLog: {},       // "YYYY-MM-DD" -> true
    studiedBefore7: false,
    studiedWeekend: false,
    achievementsUnlocked: {}, // id -> true
    userName: "",
    reminderHour: null,
  };
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? Object.assign(defaultProgress(), JSON.parse(raw)) : defaultProgress();
  } catch (e) {
    return defaultProgress();
  }
}
function saveProgress(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* silent */ }
}

let progress = loadProgress();
let toastQueue = [];
let quizSession = null; // { chapterId, idx, answers: [], selected: null, revealed: false }
let activeTab = "ler"; // for chapter reader: ler | quiz | notas

// ---------- XP / Level ----------
function addXp(amount) {
  progress.xp += amount;
  saveProgress(progress);
}

function logActivity() {
  const now = new Date();
  const key = todayKey(now);
  if (!progress.activityLog[key]) {
    progress.activityLog[key] = true;
    if (now.getHours() < 7) progress.studiedBefore7 = true;
    const day = now.getDay();
    if (day === 0 || day === 6) progress.studiedWeekend = true;
    saveProgress(progress);
  }
}

function computeStreak() {
  let streak = 0;
  let d = new Date();
  // se não estudou hoje ainda, começa a contar a partir de ontem
  if (!progress.activityLog[todayKey(d)]) {
    d.setDate(d.getDate() - 1);
  }
  while (progress.activityLog[todayKey(d)]) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function weeklyGoalProgress() {
  let count = 0;
  const d = new Date();
  for (let i = 0; i < 7; i++) {
    const dd = new Date(d);
    dd.setDate(d.getDate() - i);
    if (progress.activityLog[todayKey(dd)]) count++;
  }
  return count;
}

// ---------- Liberação sequencial (primeiros 8 dias) ----------
// Regra: os primeiros GATE_COUNT capítulos da trilha liberam um de cada vez,
// só depois de concluir o anterior. A partir do momento em que o capítulo
// GATE_COUNT é concluído, todo o restante do conteúdo já publicado libera de uma vez.
// GATE DESATIVADO — liberação total desde o início (decisão do Jeferson pra fase de validação
// do produto). Pra reativar o desbloqueio sequencial dos primeiros dias, basta voltar esse
// valor para 8 (ou o número desejado) e reativar o banner em gateBannerHTML() abaixo.
const GATE_COUNT = 0;

function gateFlatList() { return allChaptersFlat(); }

function isGateLocked(chapterId) {
  const flat = gateFlatList();
  const idx = flat.findIndex(c => c.id === chapterId);
  if (idx <= 0) return false;
  if (idx < GATE_COUNT) return !isChapterDone(flat[idx - 1].id);
  const gateChapter = flat[GATE_COUNT - 1];
  if (!gateChapter) return false;
  return !isChapterDone(gateChapter.id);
}

function isChapterDone(chapterId) { return !!progress.done[chapterId]; }

function bookProgressPct(book) {
  const chaps = allChapters(book);
  const total = chaps.length;
  const done = chaps.filter(c => isChapterDone(c.id)).length;
  return total ? Math.round((done / total) * 100) : 0;
}
function bookIsComplete(book) {
  const chaps = allChapters(book);
  return chaps.every(c => !c.locked && isChapterDone(c.id));
}

function nextChapterToStudy() {
  for (const book of BOOKS) {
    for (const cap of allChapters(book)) {
      if (!cap.locked && !isChapterDone(cap.id) && !isGateLocked(cap.id)) return { book, cap };
    }
  }
  return null;
}

function studyStats() {
  const chaptersDone = Object.keys(progress.done).filter(id => progress.done[id]).length;
  const quizzesDone = Object.keys(progress.quizResults).length;
  const perfectQuizzes = Object.values(progress.quizResults).filter(r => r.perfect).length;
  const bookDoneCount = BOOKS.filter(b => bookIsComplete(b)).length;
  const notesCount = Object.values(progress.notes).filter(n => n && n.trim().length > 0).length;
  const favoritesCount = Object.keys(progress.favorites).filter(id => progress.favorites[id]).length;
  const { current } = getLevelInfo(progress.xp);
  return {
    chaptersDone, quizzesDone, perfectQuizzes, bookDoneCount, notesCount, favoritesCount,
    xp: progress.xp, level: current.level, streak: computeStreak(),
    studiedBefore7: progress.studiedBefore7, studiedWeekend: progress.studiedWeekend,
  };
}

function totalMinutesStudied() {
  return allChaptersFlat().filter(c => !c.locked && isChapterDone(c.id))
    .reduce((sum, c) => sum + (c.tempoEstimado || 5), 0);
}

function checkAchievements() {
  const stats = studyStats();
  const newlyUnlocked = [];
  ACHIEVEMENTS_DEF.forEach(a => {
    if (!progress.achievementsUnlocked[a.id] && a.check(stats)) {
      progress.achievementsUnlocked[a.id] = true;
      newlyUnlocked.push(a);
    }
  });
  if (newlyUnlocked.length) saveProgress(progress);
  return newlyUnlocked;
}

// ---------- Toast ----------
function pushToast(text, icon) {
  toastQueue.push({ id: Date.now() + Math.random(), text, icon: icon || "✨" });
  renderToasts();
}
function renderToasts() {
  let box = document.getElementById("toast-box");
  if (!box) {
    box = document.createElement("div");
    box.id = "toast-box";
    box.className = "toast-box";
    document.body.appendChild(box);
  }
  const t = toastQueue.shift();
  if (!t) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="toast-icon">${t.icon}</span><span>${t.text}</span>`;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { el.remove(); if (toastQueue.length) renderToasts(); }, 250);
  }, 2600);
  if (toastQueue.length) setTimeout(renderToasts, 400);
}

function celebrateNewAchievements(list) {
  list.forEach((a, i) => {
    setTimeout(() => pushToast(`Conquista desbloqueada: ${a.name}`, a.icon), i * 500);
  });
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts.length === 0) return { view: "home" };
  if (parts[0] === "biblioteca") return { view: "biblioteca" };
  if (parts[0] === "book" && parts[1]) return { view: "book", bookId: parts[1] };
  if (parts[0] === "chapter" && parts[1] && parts[2]) return { view: "chapter", bookId: parts[1], chapterId: parts[2] };
  if (parts[0] === "desempenho") return { view: "desempenho" };
  if (parts[0] === "conquistas") return { view: "conquistas" };
  if (parts[0] === "perfil") return { view: "perfil" };
  return { view: "home" };
}

function streakRingSVG(pct, size = 52) {
  const r = (size - 6) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#232B3D" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#C9A15A" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

  const book = findBook(bookId);
  if (!book) return renderHome();
  const chapters = allChapters(book);
  const idx = chapters.findIndex(c => c.id === chapterId);
  const cap = chapters[idx];
  if (!cap) return renderBook(bookId);
  const accentVar = `--book-accent: var(--book-${book.cor})`;

  if (cap.locked) {
    return `
      <div class="topbar" style="${accentVar}"><a class="back-btn" href="#/book/${book.id}">${ICONS.back} Voltar</a></div>
      <div class="locked-view view-enter"><div class="lock-icon">${ICONS.lock}</div>
        <p><strong>${cap.title}</strong><br/>Este capítulo está em produção e será liberado em breve.</p></div>`;
  }

  if (isGateLocked(cap.id)) {
    return `
      <div class="topbar" style="${accentVar}"><a class="back-btn" href="#/book/${book.id}">${ICONS.back} Voltar</a></div>
      <div class="locked-view view-enter"><div class="lock-icon">${ICONS.lock}</div>
